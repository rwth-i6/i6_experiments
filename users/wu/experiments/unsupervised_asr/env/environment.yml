# The single conda env of the unsupervised_asr (phase-4a EMC) package.
#
# Hand-pinned to the reference cluster's main env (JUPITER, conda env `speech_llm`, linux-aarch64,
# GH200), read off `conda list` / `pip list --format=freeze` on 2026-09-24.  This is not a
# `conda env export`: build strings are left out wherever they are platform-specific, so the spec
# also solves on linux-64.  Create it with `install_env.sh <env_prefix>`, which also installs
# sequitur-g2p (needs SWIG 3.0.12 and --no-build-isolation) and k2 (prebuilt wheel or source build);
# neither can be expressed in this file.
#
# Platform notes:
#   * The reference env is aarch64.  On aarch64 conda-forge also pulls `arm-variant=*=sbsa` and the
#     `*_linux-aarch64` CUDA sub-packages by itself; they are not listed here.  The reference
#     pytorch build is `cuda126_generic_*` (aarch64); on linux-64 the solver picks the matching
#     `cuda126_*` build.  BLAS/OpenMP (`libblas=*=*openblas`, `_openmp_mutex=*=*_kmp_llvm` on the
#     reference) are left to the solver: they differ by platform.
#   * The ffmpeg, libvorbis and libogg pins fix the audio encode.  They are necessary, not
#     sufficient: the audio must still pass `data.ffmpeg_pin.FfmpegPinCheckJob` (README, "The
#     ffmpeg pin check"); its reference list comes from the aarch64 build.
#   * kenlm 0.3.0 (python module) is an sdist only: pip compiles it, which needs a C++ compiler
#     (cmake comes from its build requirements).  kaldilm 1.15.4 has x86_64 and aarch64 wheels.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.15
  - pip=26.1.1
  - setuptools=82.0.1
  - wheel=0.47.0
  # torch 2.7.1 with CUDA 12.6 (conda-forge build; torchaudio is not used by the package)
  - cuda-version=12.6
  - pytorch=2.7.1=cuda126*
  - pytorch-gpu=2.7.1
  # numerics and I/O (the package, RETURNN's requirements.txt: numpy, h5py, dm-tree)
  - numpy=2.4.6
  - scipy=1.17.1
  - h5py=3.16.0
  - scikit-learn=1.8.0
  - dm-tree=0.1.9
  - pysoundfile=0.13.1          # the `soundfile` module (RETURNN OggZipDataset, data/ogg_zip.py)
  - libsndfile=1.2.2
  - typeguard=4.5.2
  - psutil=7.2.2                # RETURNN, sisyphus
  - tqdm=4.67.3                 # rVADfast
  - six=1.17.0                  # sequitur-g2p
  # i6_core's ReturnnConfig.write runs black; it must be importable and on the job PATH
  - black=26.3.1
  # the pinned ffmpeg: conda-forge GPL build.  The reference is gpl_h0a60610_911 (linux-aarch64),
  # which this spec resolves to there.  The build number is not pinned: on linux-64 the _911 build
  # needs __cuda>=12.8 and conflicts with the CUDA 12.6 torch (the solver picks gpl_*_711)
  - ffmpeg=7.1.1=gpl_*
  - libvorbis=1.3.7
  - libogg=1.3.5
  # sisyphus' requirements.txt (psutil above; ipython for the console, flask for the web UI)
  - ipython=9.13.0
  - flask=3.1.3
  # i6_core ReturnnTrainingJob's `plot` task imports matplotlib (missing from this hand-pinned list)
  - matplotlib-base=3.11.2
  - pip:
      - transformers==5.9.0
      - tokenizers==0.22.2
      - safetensors==0.7.0
      - huggingface_hub==1.16.1
      - hf-xet==1.5.0
      - datasets==4.8.5
      - fsspec==2026.2.0
      - pandas==3.0.3
      - pyarrow==24.0.0
      - rVADfast==0.0.5
      - audiofile==1.6.1          # rVADfast dependency, pinned to the reference
      - kenlm==0.3.0              # lm/prior_gap.py (python module; the KenLM binaries are separate)
      - kaldilm==1.15.4           # in the reference k2 env; not imported by the package itself
      - pytest==9.1.1             # tests/
      - librosa==0.11.0           # i6_core returnn/hdf.py imports it (missing from this hand-pinned list)
